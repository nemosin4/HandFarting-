<html lang="JA-hp">
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <title>HandFarting! upload</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="title">
            <img src="imgs/logotoumei.png"><br>
            <input class="linkbutton" type="button" onclick="location.href = '/home' " value="ホーム">
            <input class="linkbutton" type="button" onclick="location.href = 'upload.htm' " value="屁の投稿">
            <input class="linkbutton" type="button" onclick="location.href = 'help.htm' " value="ヘルプ">
        </div>
        <div id="content">
            <p class="midashi">屁の投稿</p>
            <br>
            <div class="frame">
<form method="post" action="/send" enctype="multipart/form-data">
                    <p class="text">※著作物などを絶対にｱｯﾌﾟﾛｰﾄﾞしないでください。屁の名前に";"(半角セミコロン)を含まないでください。</p>
                    <p class="text">形式は、MP3 WAVE FLAC M4Aに対応しています。それ以外のﾌｫｰﾏｯﾄの場合は変換してからｱｯﾌﾟﾛｰﾄﾞしてください。MP3推奨です。</p>
                    <br>
                    <input class="textbox" type="text" placeholder="アーティスト" name="artist"><br><br>
                    <input class="textbox" type="text" placeholder="屁の名前" name="name"><br><br>
                    <input type="file" name="file"><br>
                    <input class="linkbutton" type="submit" value="投稿"><br>
                </form>
            </div>
        </div>
    </body>
</html>
